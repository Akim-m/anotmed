# Absolute safety floors for the validation gate (eval/run.py --tier absolute).
#
# THESE NUMBERS ARE A CLINICAL JUDGMENT THE OWNER MUST SIGN (PLAN.md §4).
# They are suggested starting points to negotiate from, NOT clinically blessed,
# and NOT met by the non-clinical stub backend. Adjust to your modality and the
# risk tolerance of your workflow before any real use.

segmentation:
  dice_mean: 0.85      # GT-box-prompted mean Dice over the labeled set
  dice_p10: 0.70       # 10th-percentile Dice — the worst cases must not be terrible

localization:
  recall_iou30: 0.80   # fraction of real lesions the localizer boxes (IoU >= 0.3)

format:
  compliance: 0.98     # fraction of images that yield a usable HxW bool mask

# Per-modality overrides, shallow-merged over the globals above via
# `Floors.load(modality=...)` / `eval.run --modality`. Only list what differs.
modalities:
  dental:
    # DENTEX is box-only (no GT masks) -> segmentation is NOT gated on dental;
    # the detector's localization is the floor that matters here.
    segmentation: {dice_mean: 0.0, dice_p10: 0.0}
    localization: {recall_iou30: 0.85}   # a good tooth detector should clear this easily
  dental-path:
    # Pathology (caries/lesions) is subtle and sparse -> a lower, PROVISIONAL floor,
    # to be signed from measured reality (Fable: expect ~0.50-0.70). Box-only.
    segmentation: {dice_mean: 0.0, dice_p10: 0.0}
    localization: {recall_iou30: 0.50}
