[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anotmed"
version = "0.1.0"
description = "Medical image annotation assistant — suggests boxes, masks, and measurements for radiologist verification. Not a diagnostic device."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pydicom>=2.4",
  "pydantic>=2.5",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "Pillow>=10.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27",  # thin client to the vLLM OpenAI server (backends/vllm_medgemma.py)
]

[project.optional-dependencies]
# Real models (GPU). MedSAM-2/SAM2 itself installs from git — see README.
# The vLLM MedGemma path needs no torch in the app — it talks HTTP to a separate
# vLLM server (scripts/serve_vllm.sh); only the in-process MedSAM-2 segmenter does.
models = ["torch>=2.3", "transformers>=4.44", "accelerate>=0.30"]
seg = ["highdicom>=0.22"]
dev = ["pytest>=8.0"]

[project.scripts]
anotmed-serve = "anotmed.api:main"

[tool.setuptools]
packages = ["anotmed", "anotmed.backends"]

[tool.setuptools.package-data]
anotmed = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
